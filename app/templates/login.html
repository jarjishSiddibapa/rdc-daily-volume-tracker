<!DOCTYPE html>
<html lang="en" data-theme="dark">
<script>
    // Restore saved theme before page paints — prevents flash
    (function () {
        var saved = localStorage.getItem('dvt-theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Daily Volume Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* ── CSS variable fallbacks (dark default, matches style.css) ─── */
        :root {
            --bg-primary: #080b14;
            --bg-input: rgba(10, 15, 30, 0.8);
            --border: rgba(30, 41, 70, 0.6);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
        }
        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-input: rgba(241, 245, 249, 0.9);
            --border: rgba(203, 213, 225, 0.7);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --accent-cyan: #0891b2;
            --accent-purple: #7c3aed;
            --accent-red: #dc2626;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
            overflow: hidden;
            transition: background 0.3s;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 80% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 70% 50% at 60% 10%, rgba(6, 182, 212, 0.06) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        [data-theme="light"] body::before {
            background:
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(59, 130, 246, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 80% 70%, rgba(139, 92, 246, 0.04) 0%, transparent 60%);
        }

        @keyframes bgPulse {
            0% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(59, 130, 246, 0.08);
            top: -100px;
            left: -100px;
            animation-duration: 14s;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(139, 92, 246, 0.06);
            bottom: -80px;
            right: -80px;
            animation-duration: 10s;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(6, 182, 212, 0.05);
            top: 50%;
            right: 20%;
            animation-duration: 16s;
            animation-delay: -6s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(30px, -20px) scale(1.1);
            }
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            position: relative;
            z-index: 1;
            animation: loginFadeIn 0.6s ease-out both;
        }

        @keyframes loginFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 55%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.14), transparent 55%),
                rgba(17, 25, 50, 0.86);
            backdrop-filter: blur(28px) saturate(1.35);
            border: 1px solid rgba(30, 41, 70, 0.8);
            border-radius: 24px;
            padding: 48px 42px;
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(59, 130, 246, 0.10) inset;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        [data-theme="light"] .login-card {
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.07), transparent 55%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.05), transparent 55%),
                rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(203, 213, 225, 0.8);
            box-shadow:
                0 12px 48px rgba(15, 23, 42, 0.12),
                0 0 0 1px rgba(59, 130, 246, 0.08) inset;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                    var(--accent-blue),
                    var(--accent-cyan),
                    var(--accent-purple),
                    var(--accent-blue));
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo .logo-icon {
            font-size: 44px;
            color: var(--accent-blue);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(6, 182, 212, 0.08));
            padding: 16px;
            border-radius: 18px;
            display: inline-block;
            margin-bottom: 14px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
        }

        .login-logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .login-logo p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .login-form .form-group {
            margin-bottom: 22px;
        }

        .login-form .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .login-form .form-control {
            width: 100%;
            padding: 13px 18px;
            font-size: 0.95rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            transition: all 0.25s ease;
        }

        .login-form .form-control:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15), 0 0 20px rgba(59, 130, 246, 0.08);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 8px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-hover));
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4), 0 8px 24px rgba(59, 130, 246, 0.25);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .flash-message {
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
        }

        .flash-message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .flash-message.info {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        /* ── Theme toggle ────────────────────────────────────────────────── */
        .login-theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 10;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        .login-theme-toggle:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }
        .login-theme-toggle .material-icons-round { font-size: 20px; }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 16px;
                align-items: flex-start;
            }

            .login-card {
                padding: 32px 22px;
                border-radius: 20px;
            }

            .login-logo h1 {
                font-size: 1.5rem;
            }

            .login-logo p {
                font-size: 0.82rem;
            }
        }
    </style>
</head>

<body>
    <!-- Theme toggle -->
    <button class="login-theme-toggle" id="loginThemeToggle" title="Toggle light/dark mode" onclick="toggleLoginTheme()">
        <span class="material-icons-round" id="loginThemeIcon">light_mode</span>
    </button>

    <!-- Floating orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <span class="material-icons-round logo-icon">analytics</span>
                <h1>RDC DVT</h1>
                <p>Daily Volume Tracker</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash-message {{ category }}">
                <span class="material-icons-round">{{ 'error' if category == 'error' else 'info' }}</span>
                {{ message }}
            </div>
            {% endfor %}
            {% endwith %}

            <form class="login-form" method="POST" action="{{ url_for('auth.login_submit') }}">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" class="form-control" id="username" name="username"
                        placeholder="Enter username or email" autocomplete="username" autofocus required>
                </div>
                <div class="form-group">
                    <label for="password" style="display:flex;justify-content:space-between;align-items:center;">
                        <span>Password</span>
                        <a href="{{ url_for('auth.forgot_password_page') }}"
                           style="font-size:0.78rem;font-weight:500;color:var(--accent-blue);text-decoration:none;opacity:0.85;">
                            Forgot password?
                        </a>
                    </label>
                    <div class="pw-input-wrap">
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="pw-eye-btn"
                            onclick="togglePw('password','loginPwEyeIcon')" tabindex="-1">
                            <span class="material-icons-round" id="loginPwEyeIcon">visibility</span>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary login-btn">
                    <span class="material-icons-round">login</span>
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                Daily Volume Tracker
                <br>
                <span style="opacity:0.8;">Made with <3 by Jarjish &middot; RDC IT Team</span>
            </div>
        </div>
    </div>
<script>
    function togglePw(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        if (!input) return;
        input.type = input.type === 'password' ? 'text' : 'password';
        if (icon) icon.textContent = input.type === 'password' ? 'visibility' : 'visibility_off';
    }

    function _applyLoginThemeIcon() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const icon = document.getElementById('loginThemeIcon');
        if (icon) icon.textContent = isDark ? 'light_mode' : 'dark_mode';
    }

    function toggleLoginTheme() {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', next);
        localStorage.setItem('dvt-theme', next);
        _applyLoginThemeIcon();
    }

    // Set correct icon on load
    _applyLoginThemeIcon();
</script>
</body>

</html>
