<div class="page-progress" id="pageProgress" role="progressbar" aria-label="Loading" aria-hidden="true">
    <span class="page-progress-bar"></span>
    <span class="page-progress-message" role="status" aria-live="polite">One sec… pretending this is very complicated 😎</span>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var root = document.documentElement;
        var activeButton = null;

        document.querySelectorAll('form').forEach(function (form) {
            form.addEventListener('submit', function () {
                activeButton = form.querySelector('button[type="submit"]');
                root.classList.add('is-loading');
                document.getElementById('pageProgress').setAttribute('aria-hidden', 'false');
                if (activeButton) {
                    activeButton.classList.add('is-busy');
                    activeButton.disabled = true;
                    activeButton.setAttribute('aria-busy', 'true');
                }
            });
        });

        document.querySelectorAll('a[href]').forEach(function (link) {
            link.addEventListener('click', function (event) {
                if (!event.defaultPrevented && link.origin === window.location.origin) {
                    root.classList.add('is-loading');
                    document.getElementById('pageProgress').setAttribute('aria-hidden', 'false');
                }
            });
        });

        window.addEventListener('pageshow', function () {
            root.classList.remove('is-loading');
            document.getElementById('pageProgress').setAttribute('aria-hidden', 'true');
            if (activeButton) {
                activeButton.classList.remove('is-busy');
                activeButton.disabled = false;
                activeButton.removeAttribute('aria-busy');
            }
        });
    });
</script>
